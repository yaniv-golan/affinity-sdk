name: Build MCP Plugin

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '!mcp/dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install mcp-bash CLI
        run: |
          source mcp/mcp-bash.lock
          echo "Installing mcp-bash v${MCPBASH_VERSION} for bundle tooling"
          curl -fsSL https://raw.githubusercontent.com/yaniv-golan/mcp-bash-framework/main/install.sh | \
            bash -s -- --version "v${MCPBASH_VERSION}" --yes
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify vendored runtime integrity
        run: |
          cd mcp
          mcp-bash vendor --verify
          echo "Vendored runtime integrity verified (SHA-256)"

      - name: Validate MCP server project
        # Uses the full mcp-bash installed above; the vendored runtime has no validate.
        run: ./mcp/xaffinity-mcp.sh validate

      - name: Build MCP plugin ZIP
        run: make -C mcp plugin

      - name: Verify plugin structure
        run: |
          make -C mcp verify
          test -f mcp/.claude-plugin/xaffinity-mcp.sh
          test -f mcp/.claude-plugin/plugin.json
          test -f mcp/.claude-plugin/xaffinity-mcp-plugin.zip
          test -f mcp/.claude-plugin/VERSION
          echo "Plugin structure validated"

      - name: Test extraction
        run: |
          cd mcp/.claude-plugin
          mkdir -p .mcp-extracted
          unzip -q xaffinity-mcp-plugin.zip -d .mcp-extracted
          test -x .mcp-extracted/xaffinity-mcp.sh
          test -f .mcp-extracted/VERSION
          rm -rf .mcp-extracted
          echo "Extraction test passed"

      - name: Validate MCPB configuration
        run: |
          cd mcp
          mcp-bash bundle --validate
          echo "MCPB configuration validated"

      - name: Build MCPB bundle
        run: |
          cd mcp
          mcp-bash bundle --output dist --verbose
          ls -la dist/*.mcpb
          echo "MCPB bundle created"

      - name: Validate MCPB bundle structure
        run: |
          cd mcp
          MCPB_FILE=$(ls dist/*.mcpb | head -1)
          unzip -t "$MCPB_FILE"
          unzip -p "$MCPB_FILE" manifest.json | jq .
          echo "MCPB bundle structure validated"

      - name: Bundle env reaches tools on every platform
        run: |
          # Claude Desktop replaces mcp_config.env with platform_overrides.<platform>.env (it does not
          # merge), so each platform's env must be the base env plus the four env-policy keys.
          cd mcp
          MCPB_FILE=$(ls dist/*.mcpb | head -1)
          unzip -p "$MCPB_FILE" manifest.json | jq -e '
            .server.mcp_config as $c
            | ["darwin", "linux", "win32"]
            | all(. as $p
                | ($c.platform_overrides[$p].env // {}) as $o
                | ($o | with_entries(select(.key | test("^MCPBASH_(TOOL|PROVIDER)_ENV_") | not))) == $c.env
                  and $o.MCPBASH_TOOL_ENV_MODE == "allowlist"
                  and $o.MCPBASH_PROVIDER_ENV_MODE == "allowlist"
                  and ($o.MCPBASH_TOOL_ENV_ALLOWLIST | split(",") | index("AFFINITY_API_KEY") != null)
                  and $o.MCPBASH_TOOL_ENV_ALLOWLIST == $o.MCPBASH_PROVIDER_ENV_ALLOWLIST)
          ' >/dev/null || { echo "::error::platform_overrides env does not match mcp_config.env + policy keys (run python tools/sync_mcp_bundle_env.py)"; exit 1; }
          echo "Bundle env overrides OK"

      - name: Test MCPB bundle health check
        run: |
          cd mcp
          MCPB_FILE=$(ls dist/*.mcpb | head -1)
          EXTRACT_DIR=$(mktemp -d)
          unzip -q "$MCPB_FILE" -d "$EXTRACT_DIR"
          # Test the wrapper script health check
          "$EXTRACT_DIR/server/run-server.sh" --health || echo "Health check not available (expected if CLI not configured)"
          rm -rf "$EXTRACT_DIR"
          echo "MCPB bundle test completed"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcp-plugin
          path: |
            mcp/.claude-plugin/xaffinity-mcp-plugin.zip
            mcp/dist/*.mcpb
          retention-days: 30
